[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yarginator"
version = "0.1.0"
description = "Command-line charting toolkit for YARG: stems in, notes.mid + lights + REAPER project out."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "mido>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Audio analysis (pitch tracking, beat detection, energy, drum classification). Not needed to edit/merge charts or build REAPER projects.
audio = ["librosa>=0.10", "soundfile>=0.12", "scikit-learn>=1.3"]
# Polyphonic transcription for keys (Spotify Basic Pitch). Pulls in TensorFlow and needs Python 3.11;
# Basic Pitch doesn't support newer Pythons yet.
keys = ["basic-pitch>=0.4; python_version < '3.12'"]
# Video in (`yarginator new`): bundles an ffmpeg binary; an ffmpeg on the PATH works too.
video = ["imageio-ffmpeg>=0.5"]
# Built-in stem separation (`yarginator separate`): audio-separator (UVR models) + PyTorch, CPU is fine.
# Pinned to the last release that works with numpy 1.x, which TensorFlow (keys) needs.
separate = ["audio-separator[cpu]==0.30.2", "numpy<2"]
dev = ["pytest>=8"]

[project.scripts]
yarginator = "yarginator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yarginator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
